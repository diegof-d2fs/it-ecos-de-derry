<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 860" width="1400" height="860" font-family="Arial, Helvetica, sans-serif">
<defs>
  <marker id="ponta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#444"/>
  </marker>
  <style>
    .grupo { fill: none; stroke: #8a8a8a; stroke-width: 1.4; stroke-dasharray: 7 5; }
    .titulo-grupo { font-size: 15px; font-weight: bold; fill: #333; }
    .caixa { fill: #f1f1f1; stroke: #6b6b6b; stroke-width: 1.3; }
    .destaque { fill: #e3ecf7; stroke: #4a6a94; stroke-width: 1.5; }
    .titulo { font-size: 16px; font-weight: bold; fill: #111; text-anchor: middle; }
    .texto { font-size: 13.5px; fill: #333; text-anchor: middle; }
    .seta { fill: none; stroke: #444; stroke-width: 1.4; }
    .tracejada { stroke-dasharray: 5 4; }
    .rotulo { font-size: 13px; fill: #333; paint-order: stroke; stroke: #fff; stroke-width: 5px; }
    .principal { font-size: 21px; font-weight: bold; fill: #111; text-anchor: middle; }
    .nota { font-size: 13px; fill: #555; text-anchor: middle; }
  </style>
</defs>
<rect width="1400" height="860" fill="#fff"/>
<text x="700.0" y="38" class="principal">Arquitetura da versão web na AWS (us-east-1)</text>
<rect x="530" y="62" width="340" height="62" rx="6" class="caixa"/>
<text x="700.0" y="88" class="titulo">Jogador: navegador</text>
<text x="700.0" y="108" class="texto">teclado ou controle · computador, celular, tablet</text>
<rect x="1030" y="62" width="320" height="62" rx="6" class="caixa"/>
<text x="1190.0" y="88" class="titulo">Wiki ilustrada</text>
<text x="1190.0" y="108" class="texto">GitHub Pages, publicada pelo GitHub Actions</text>
<path d="M870,93 L1026,93" class="seta" marker-end="url(#ponta)"/>
<text x="948" y="84" class="rotulo" text-anchor="middle">Ler lore (nova aba)</text>
<rect x="40" y="150" width="1320" height="140" rx="10" class="grupo"/>
<text x="54" y="172" class="titulo-grupo">Borda</text>
<rect x="70" y="190" width="300" height="78" rx="6" class="caixa"/>
<text x="220.0" y="216" class="titulo">Route 53 e ACM</text>
<text x="220.0" y="236" class="texto">ecosdederry.click: domínio, DNS</text>
<text x="220.0" y="253" class="texto">e certificado TLS</text>
<rect x="550" y="190" width="300" height="78" rx="6" class="caixa"/>
<text x="700.0" y="216" class="titulo">CloudFront</text>
<text x="700.0" y="236" class="texto">HTTPS, HTTP/2 e 3, compressão,</text>
<text x="700.0" y="253" class="texto">cabeçalhos de segurança</text>
<rect x="1030" y="190" width="300" height="78" rx="6" class="caixa"/>
<text x="1180.0" y="216" class="titulo">S3: site do jogo</text>
<text x="1180.0" y="236" class="texto">bucket privado (OAC): HTML, WASM,</text>
<text x="1180.0" y="253" class="texto">dados do jogo e músicas</text>
<path d="M700,124 L700,186" class="seta" marker-end="url(#ponta)"/>
<text x="712" y="160" class="rotulo" text-anchor="start">HTTPS</text>
<path d="M370,229 L546,229" class="seta" marker-end="url(#ponta)"/>
<path d="M850,229 L1026,229" class="seta" marker-end="url(#ponta)"/>
<text x="938" y="220" class="rotulo" text-anchor="middle">arquivos do jogo</text>
<rect x="40" y="330" width="620" height="150" rx="10" class="grupo"/>
<text x="54" y="352" class="titulo-grupo">Contas</text>
<rect x="70" y="372" width="290" height="86" rx="6" class="caixa"/>
<text x="215.0" y="398" class="titulo">Amazon Cognito</text>
<text x="215.0" y="418" class="texto">login gerenciado em pt-BR,</text>
<text x="215.0" y="435" class="texto">apelido ou e-mail, código por e-mail</text>
<rect x="390" y="372" width="240" height="86" rx="6" class="caixa"/>
<text x="510.0" y="398" class="titulo">Lambda PreSignUp</text>
<text x="510.0" y="418" class="texto">valida o apelido e recusa</text>
<text x="510.0" y="435" class="texto">e-mail já cadastrado</text>
<path d="M360,415 L386,415" class="seta" marker-end="url(#ponta)"/>
<rect x="700" y="330" width="660" height="150" rx="10" class="grupo"/>
<text x="714" y="352" class="titulo-grupo">API (dados de cada conta)</text>
<rect x="730" y="372" width="280" height="86" rx="6" class="caixa"/>
<text x="870.0" y="398" class="titulo">API Gateway (HTTP API)</text>
<text x="870.0" y="418" class="texto">exige o token JWT do Cognito,</text>
<text x="870.0" y="435" class="texto">até 20 pedidos por segundo</text>
<rect x="1050" y="372" width="280" height="86" rx="6" class="destaque"/>
<text x="1190.0" y="398" class="titulo">Lambda da API (Python 3.13)</text>
<text x="1190.0" y="418" class="texto">memory card, perfil, ranking,</text>
<text x="1190.0" y="435" class="texto">feedback e demonstrações</text>
<path d="M1010,415 L1046,415" class="seta" marker-end="url(#ponta)"/>
<path d="M530,104 L215,104 L215,368" class="seta" marker-end="url(#ponta)"/>
<text x="225" y="140" class="rotulo" text-anchor="start">login: OAuth 2.0 com PKCE</text>
<path d="M870,112 L980,112 L980,136 L1380,136 L1380,310 L870,310 L870,368" class="seta" marker-end="url(#ponta)"/>
<text x="1120" y="304" class="rotulo" text-anchor="middle">pedidos com o token (fetch)</text>
<rect x="700" y="520" width="660" height="150" rx="10" class="grupo"/>
<text x="714" y="542" class="titulo-grupo">Dados</text>
<rect x="730" y="562" width="280" height="86" rx="6" class="caixa"/>
<text x="870.0" y="588" class="titulo">S3: saves (privado)</text>
<text x="870.0" y="608" class="texto">memory card por conta (ETag contra</text>
<text x="870.0" y="625" class="texto">conflito), ranking e feedbacks</text>
<rect x="1050" y="562" width="280" height="86" rx="6" class="caixa"/>
<text x="1190.0" y="588" class="titulo">Amazon SES</text>
<text x="1190.0" y="608" class="texto">avisa cada feedback</text>
<text x="1190.0" y="625" class="texto">por e-mail</text>
<path d="M1130,458 L1130,520 L870,520 L870,558" class="seta" marker-end="url(#ponta)"/>
<text x="1000" y="512" class="rotulo" text-anchor="middle">lê e grava</text>
<path d="M1250,458 L1250,558" class="seta" marker-end="url(#ponta)"/>
<rect x="40" y="520" width="620" height="150" rx="10" class="grupo"/>
<text x="54" y="542" class="titulo-grupo">Operação e custos</text>
<rect x="70" y="562" width="290" height="86" rx="6" class="caixa"/>
<text x="215.0" y="588" class="titulo">CloudWatch e SNS</text>
<text x="215.0" y="608" class="texto">logs por 30 dias, 4 alarmes</text>
<text x="215.0" y="625" class="texto">de capacidade, alerta por e-mail</text>
<rect x="390" y="562" width="240" height="86" rx="6" class="caixa"/>
<text x="510.0" y="588" class="titulo">AWS Budgets</text>
<text x="510.0" y="608" class="texto">US$ 12,50 por mês, só o que</text>
<text x="510.0" y="625" class="texto">tem a etiqueta do projeto</text>
<path d="M1090,458 L1090,500 L215,500 L215,558" class="seta tracejada" marker-end="url(#ponta)"/>
<text x="650" y="492" class="rotulo" text-anchor="middle">logs e métricas</text>
<rect x="530" y="730" width="340" height="52" rx="6" class="caixa"/>
<text x="700.0" y="761.0" class="titulo">Responsável (e-mail)</text>
<path d="M215,648 L215,756 L526,756" class="seta" marker-end="url(#ponta)"/>
<path d="M510,648 L510,742 L526,742" class="seta" marker-end="url(#ponta)"/>
<path d="M1190,648 L1190,756 L874,756" class="seta" marker-end="url(#ponta)"/>
<text x="1030" y="748" class="rotulo" text-anchor="middle">feedbacks</text>
<text x="700.0" y="838" class="nota">Implantação: CloudFormation (web/infra.yaml) com tools/configurar_nuvem.sh; site com tools/publicar_web.sh (S3 + invalidação do CloudFront). Todo recurso leva a etiqueta projeto=ecos-de-derry.</text>
</svg>
