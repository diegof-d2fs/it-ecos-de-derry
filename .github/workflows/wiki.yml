name: Publicar wiki
on:
  push:
    branches: [main]
    paths:
      - 'wiki/**'
      - '.github/workflows/wiki.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v6
      - name: Preparar Pages
        uses: actions/configure-pages@v5
      - name: Empacotar wiki
        uses: actions/upload-pages-artifact@v4
        with:
          path: wiki
      - name: Publicar wiki
        id: deployment
        uses: actions/deploy-pages@v4
