AWSTemplateFormatVersion: '2010-09-09'
Description: Conta, cartao privado, ranking e feedback de IT Ecos de Derry
Parameters:
  SiteOrigin:
    Type: CommaDelimitedList
    Description: Origens HTTPS do jogo, sem barra final (dominio proprio e cloudfront.net)
  CallbackUrl:
    Type: CommaDelimitedList
    Description: URLs completas de retorno do Cognito, uma por origem
  CodeBucket:
    Type: String
  CodeKey:
    Type: String
  SaveBucketName:
    Type: String
  CognitoPrefix:
    Type: String
  AdminEmail:
    Type: String
    Description: E-mail do administrador (rotas de demonstracao e destino do feedback). Vem do .env local, nunca do repositorio.
Resources:
  SaveBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Ref SaveBucketName
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: {SSEAlgorithm: AES256}
      LifecycleConfiguration:
        Rules:
          - Id: LimitesDeFeedback
            Prefix: feedback/limites/
            Status: Enabled
            ExpirationInDays: 2
  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: ecos-de-derry
      UserPoolTier: ESSENTIALS
      LambdaConfig:
        PreSignUp: !GetAtt NickValidator.Arn
      UsernameConfiguration: {CaseSensitive: false}
      AliasAttributes: [email]
      AutoVerifiedAttributes: [email]
      Schema:
        - Name: email
          Required: true
          Mutable: true
      Policies:
        PasswordPolicy:
          MinimumLength: 10
          RequireUppercase: true
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: false
      AccountRecoverySetting:
        RecoveryMechanisms:
          - Name: verified_email
            Priority: 1
      AdminCreateUserConfig: {AllowAdminCreateUserOnly: false}
      VerificationMessageTemplate:
        DefaultEmailOption: CONFIRM_WITH_CODE
        EmailSubject: 'IT: Ecos de Derry - confirme seu e-mail'
        EmailMessage: 'Seu codigo de confirmacao para IT: Ecos de Derry e {####}.'
  NickValidatorRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: lambda.amazonaws.com}
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: email-unico
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: cognito-idp:ListUsers
                Resource: !Sub 'arn:aws:cognito-idp:${AWS::Region}:${AWS::AccountId}:userpool/*'
  NickValidator:
    Type: AWS::Lambda::Function
    Properties:
      Runtime: python3.13
      Handler: index.handler
      Role: !GetAtt NickValidatorRole.Arn
      Timeout: 10
      Code:
        ZipFile: |
          import re
          import boto3
          cognito = boto3.client('cognito-idp')
          def handler(event, context):
              nick = event.get('userName', '')
              if not re.fullmatch(r'(?=.*[A-Za-z0-9])[A-Za-z0-9._-]{3,20}', nick):
                  raise ValueError('Apelido: de 3 a 20 caracteres, s\u00f3 letras sem acento, n\u00fameros, ponto, tra\u00e7o ou sublinhado.')
              email = (event.get('request', {}).get('userAttributes', {}).get('email') or '').strip()
              if not re.fullmatch(r'[^@\s"]+@[^@\s"]+', email):
                  raise ValueError('E-mail inv\u00e1lido.')
              for valor in {email, email.lower()}:
                  achados = cognito.list_users(UserPoolId=event['userPoolId'], Filter=f'email = "{valor}"', Limit=10)
                  for u in achados.get('Users', []):
                      attrs = {a['Name']: a['Value'] for a in u.get('Attributes', [])}
                      if u.get('UserStatus') == 'CONFIRMED' and attrs.get('email_verified') == 'true':
                          raise ValueError('Este e-mail j\u00e1 tem uma conta. Use Entrar ou Esqueci minha senha.')
              return event
  NickValidatorPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref NickValidator
      Principal: cognito-idp.amazonaws.com
      SourceArn: !GetAtt UserPool.Arn
  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref UserPool
      ClientName: jogo-web
      GenerateSecret: false
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthFlows: [code]
      AllowedOAuthScopes: [openid, email]
      CallbackURLs: !Ref CallbackUrl
      LogoutURLs: !Ref CallbackUrl
      SupportedIdentityProviders: [COGNITO]
      PreventUserExistenceErrors: ENABLED
      EnableTokenRevocation: true
      RefreshTokenValidity: 30
  UserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      UserPoolId: !Ref UserPool
      Domain: !Ref CognitoPrefix
      ManagedLoginVersion: 2
  Branding:
    Type: AWS::Cognito::ManagedLoginBranding
    DependsOn: UserPoolDomain
    Properties:
      UserPoolId: !Ref UserPool
      ClientId: !Ref UserPoolClient
      UseCognitoProvidedValues: true
  ApiRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: lambda.amazonaws.com}
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: dados-privados
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [s3:GetObject, s3:PutObject]
                Resource: !Sub '${SaveBucket.Arn}/*'
              # Sem ListBucket o S3 responde AccessDenied (nao NoSuchKey) para arquivo inexistente: conta nova dava 500.
              - Effect: Allow
                Action: s3:ListBucket
                Resource: !GetAtt SaveBucket.Arn
              - Effect: Allow
                Action: ses:SendEmail
                Resource: !Sub 'arn:aws:ses:${AWS::Region}:${AWS::AccountId}:identity/${AdminEmail}'
              - Effect: Allow
                Action: cognito-idp:AdminGetUser
                Resource: !GetAtt UserPool.Arn
  ApiFunction:
    Type: AWS::Lambda::Function
    Properties:
      Runtime: python3.13
      Handler: save_api.handler
      Role: !GetAtt ApiRole.Arn
      Timeout: 15
      MemorySize: 128
      Code:
        S3Bucket: !Ref CodeBucket
        S3Key: !Ref CodeKey
      Environment:
        Variables:
          SAVE_BUCKET: !Ref SaveBucket
          USER_POOL_ID: !Ref UserPool
          DEMO_ADMIN_EMAIL: !Ref AdminEmail
          FEEDBACK_EMAIL: !Ref AdminEmail
  HttpApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: ecos-de-derry-api
      ProtocolType: HTTP
      CorsConfiguration:
        AllowOrigins: !Ref SiteOrigin
        AllowMethods: [GET, PUT, POST, OPTIONS]
        AllowHeaders: [Authorization, Content-Type]
        MaxAge: 600
  ApiIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref HttpApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt ApiFunction.Arn
      PayloadFormatVersion: '2.0'
  JwtAuthorizer:
    Type: AWS::ApiGatewayV2::Authorizer
    Properties:
      ApiId: !Ref HttpApi
      AuthorizerType: JWT
      Name: conta-cognito
      IdentitySource: ['$request.header.Authorization']
      JwtConfiguration:
        Audience: [!Ref UserPoolClient]
        Issuer: !Sub 'https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}'
  GetSaves:
    Type: AWS::ApiGatewayV2::Route
    Properties: {ApiId: !Ref HttpApi, RouteKey: 'GET /saves', AuthorizationType: JWT, AuthorizerId: !Ref JwtAuthorizer, Target: !Sub 'integrations/${ApiIntegration}'}
  PutSaves:
    Type: AWS::ApiGatewayV2::Route
    Properties: {ApiId: !Ref HttpApi, RouteKey: 'PUT /saves', AuthorizationType: JWT, AuthorizerId: !Ref JwtAuthorizer, Target: !Sub 'integrations/${ApiIntegration}'}
  GetProfile:
    Type: AWS::ApiGatewayV2::Route
    Properties: {ApiId: !Ref HttpApi, RouteKey: 'GET /profile', AuthorizationType: JWT, AuthorizerId: !Ref JwtAuthorizer, Target: !Sub 'integrations/${ApiIntegration}'}
  PutProfile:
    Type: AWS::ApiGatewayV2::Route
    Properties: {ApiId: !Ref HttpApi, RouteKey: 'PUT /profile', AuthorizationType: JWT, AuthorizerId: !Ref JwtAuthorizer, Target: !Sub 'integrations/${ApiIntegration}'}
  GetRanking:
    Type: AWS::ApiGatewayV2::Route
    Properties: {ApiId: !Ref HttpApi, RouteKey: 'GET /ranking', AuthorizationType: JWT, AuthorizerId: !Ref JwtAuthorizer, Target: !Sub 'integrations/${ApiIntegration}'}
  PostFeedback:
    Type: AWS::ApiGatewayV2::Route
    Properties: {ApiId: !Ref HttpApi, RouteKey: 'POST /feedback', AuthorizationType: JWT, AuthorizerId: !Ref JwtAuthorizer, Target: !Sub 'integrations/${ApiIntegration}'}
  GetAdmin:
    Type: AWS::ApiGatewayV2::Route
    Properties: {ApiId: !Ref HttpApi, RouteKey: 'GET /admin', AuthorizationType: JWT, AuthorizerId: !Ref JwtAuthorizer, Target: !Sub 'integrations/${ApiIntegration}'}
  DefaultStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref HttpApi
      StageName: '$default'
      AutoDeploy: true
      DefaultRouteSettings:
        ThrottlingBurstLimit: 60
        ThrottlingRateLimit: 20
  InvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref ApiFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${HttpApi}/*/*'
  NickValidatorLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${NickValidator}'
      RetentionInDays: 30
  ApiFunctionLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${ApiFunction}'
      RetentionInDays: 30
  Alertas:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: ecos-de-derry-alertas
      DisplayName: Ecos de Derry
      Subscription:
        - Protocol: email
          Endpoint: !Ref AdminEmail
  # Capacidade: a conta tem 10 execucoes simultaneas de Lambda; isto cobre 15 a 20 jogadores.
  AlarmeCapacidade:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: ecos-de-derry-capacidade
      AlarmDescription: >-
        IT Ecos de Derry: a API chegou a 6 de 10 execucoes simultaneas (mais de 15 a 20 jogadores ao mesmo tempo).
        Hora de planejar o aumento: pedir no Service Quotas a cota Lambda Concurrent executions (1000) e
        subir o limite de pedidos da API em web/infra.yaml.
      Namespace: AWS/Lambda
      MetricName: ConcurrentExecutions
      Dimensions: [{Name: FunctionName, Value: !Ref ApiFunction}]
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 6
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref Alertas]
  AlarmeRecusas:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: ecos-de-derry-recusas
      AlarmDescription: >-
        IT Ecos de Derry: a Lambda recusou pedidos por falta de capacidade. Jogadores podem ter caido no modo sem conta.
        Hora de pedir o aumento da cota Lambda Concurrent executions no Service Quotas.
      Namespace: AWS/Lambda
      MetricName: Throttles
      Dimensions: [{Name: FunctionName, Value: !Ref ApiFunction}]
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref Alertas]
  AlarmeLimiteApi:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: ecos-de-derry-limite-api
      AlarmDescription: >-
        IT Ecos de Derry: muitos pedidos recusados pela API (erros 4xx, inclui o limite de 20 por segundo).
        Se houver muita gente jogando, e hora de subir ThrottlingRateLimit em web/infra.yaml.
      Namespace: AWS/ApiGateway
      MetricName: 4xx
      Dimensions: [{Name: ApiId, Value: !Ref HttpApi}, {Name: Stage, Value: $default}]
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 50
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref Alertas]
  AlarmeEmailsCadastro:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: ecos-de-derry-emails-cadastro
      AlarmDescription: >-
        IT Ecos de Derry: 35 cadastros em 24 horas. O Cognito envia no maximo 50 e-mails por dia;
        hora de pedir a saida do sandbox do SES e ligar o SES como remetente do Cognito.
      Namespace: AWS/Cognito
      MetricName: SignUpSuccesses
      Dimensions: [{Name: UserPool, Value: !Ref UserPool}, {Name: UserPoolClient, Value: !Ref UserPoolClient}]
      Statistic: Sum
      Period: 86400
      EvaluationPeriods: 1
      Threshold: 35
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref Alertas]
  # Orcamento so deste projeto: filtra pela etiqueta projeto=ecos-de-derry (ativada no Billing).
  Orcamento:
    Type: AWS::Budgets::Budget
    Properties:
      Budget:
        BudgetName: ecos-de-derry-mensal
        BudgetType: COST
        TimeUnit: MONTHLY
        BudgetLimit: {Amount: 12.5, Unit: USD}
        CostFilters:
          TagKeyValue: ['user:projeto$ecos-de-derry']
      NotificationsWithSubscribers:
        - Notification: {NotificationType: ACTUAL, ComparisonOperator: GREATER_THAN, Threshold: 80, ThresholdType: PERCENTAGE}
          Subscribers: [{SubscriptionType: EMAIL, Address: !Ref AdminEmail}]
        - Notification: {NotificationType: ACTUAL, ComparisonOperator: GREATER_THAN, Threshold: 100, ThresholdType: PERCENTAGE}
          Subscribers: [{SubscriptionType: EMAIL, Address: !Ref AdminEmail}]
        - Notification: {NotificationType: FORECASTED, ComparisonOperator: GREATER_THAN, Threshold: 100, ThresholdType: PERCENTAGE}
          Subscribers: [{SubscriptionType: EMAIL, Address: !Ref AdminEmail}]
Outputs:
  ApiUrl: {Value: !Sub 'https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com'}
  CognitoDomain: {Value: !Sub 'https://${CognitoPrefix}.auth.${AWS::Region}.amazoncognito.com'}
  ClientId: {Value: !Ref UserPoolClient}
  UserPoolId: {Value: !Ref UserPool}
  SaveBucket: {Value: !Ref SaveBucket}
  BrandingId: {Value: !Ref Branding}
